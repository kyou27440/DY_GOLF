    <script>
        (function () {
            const VER = '1.3.7_20260828_1145';
            const saved = localStorage.getItem('app_ver_v1');
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(r => r.forEach(x => x.unregister())).catch(() => { });
            }
            if ('caches' in window) {
                caches.keys().then(n => n.forEach(x => caches.delete(x))).catch(() => { });
            }
            if (saved !== VER) {
                localStorage.setItem('app_ver_v1', VER);
                if (saved) setTimeout(() => location.reload(true), 80);
            }
        })();
    </script>
